<!-- شات عادل (نسخة الشخصية) -->
<style>
  #adel-launch{position:fixed;bottom:84px;right:20px;z-index:9999;display:flex;align-items:center;
    gap:10px;background:#fff;border:none;border-radius:40px;padding:6px 16px 6px 6px;cursor:pointer;
    box-shadow:0 8px 24px rgba(40,50,90,.25);font-family:'Cairo',Tahoma,sans-serif;direction:rtl}
  #adel-launch .av{width:52px;height:52px;border-radius:50%;overflow:hidden;position:relative;flex-shrink:0;
    border:3px solid #00C2A8}
  #adel-launch .dot{position:absolute;bottom:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:#25D366;border:2px solid #fff}
  #adel-launch span.t{font-weight:700;font-size:14px;color:#1E2749;white-space:nowrap}
  #adel-launch.pulse{animation:adelPulse 2.4s infinite}
  @keyframes adelPulse{0%,100%{box-shadow:0 8px 24px rgba(40,50,90,.25)}50%{box-shadow:0 8px 30px rgba(0,194,168,.6)}}

  #adel-box{position:fixed;bottom:156px;right:20px;width:360px;max-width:calc(100vw - 24px);
    height:560px;max-height:calc(100vh - 176px);background:#fff;border-radius:22px;
    box-shadow:0 20px 50px rgba(40,50,90,.35);display:none;flex-direction:column;overflow:hidden;
    z-index:9999;font-family:'Cairo',Tahoma,sans-serif;direction:rtl}
  #adel-head{background:linear-gradient(135deg,#7C5CFC,#FF6B6B);color:#fff;padding:18px 16px 14px;
    display:flex;align-items:center;gap:14px;position:relative}
  #adel-head .big{width:76px;height:76px;border-radius:50%;overflow:hidden;border:4px solid rgba(255,255,255,.9);
    background:#fff;flex-shrink:0;position:relative}
  #adel-head .big img,#adel-launch .av img,.adel-svg{width:100%;height:100%;object-fit:cover;display:block}
  #adel-head .big::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid #FFC93C;
    opacity:0;pointer-events:none}
  .speaking .big::after{animation:ring 1s infinite}
  @keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.25);opacity:0}}
  .speaking .big img,.speaking .big .adel-svg{animation:bob .5s infinite alternate}
  @keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px) scale(1.03)}}
  .speaking .mouth{animation:talk .22s infinite alternate;transform-origin:50% 50%;transform-box:fill-box}
  @keyframes talk{from{transform:scaleY(.4)}to{transform:scaleY(1.5)}}
  #adel-head h4{font-size:17px;font-weight:800;margin-bottom:2px}
  #adel-head .st{font-size:12.5px;opacity:.95;display:flex;align-items:center;gap:6px}
  #adel-head .st i{width:8px;height:8px;border-radius:50%;background:#25D366;display:inline-block}
  .wave{display:none;gap:3px;align-items:flex-end;height:14px;margin-top:6px}
  .speaking .wave{display:flex}
  .wave b{width:3px;background:#fff;border-radius:2px;animation:wv .6s infinite alternate}
  .wave b:nth-child(2){animation-delay:.15s}.wave b:nth-child(3){animation-delay:.3s}
  .wave b:nth-child(4){animation-delay:.45s}
  @keyframes wv{from{height:3px}to{height:14px}}
  .hbtn{position:absolute;top:10px;left:10px;display:flex;gap:6px}
  .hbtn button{background:rgba(255,255,255,.2);color:#fff;border:none;width:32px;height:32px;border-radius:50%;
    cursor:pointer;font-size:15px}

  #adel-msgs{flex:1;overflow-y:auto;padding:14px;background:#F0F3FF}
  .adel-m{max-width:84%;padding:9px 13px;border-radius:16px;margin-bottom:9px;line-height:1.7;
    font-size:14px;white-space:pre-wrap;animation:pop .2s ease}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .adel-user{background:#7C5CFC;color:#fff;margin-left:auto;border-bottom-left-radius:4px}
  .adel-bot{background:#fff;color:#1E2749;border:1px solid #E4E7F5;margin-right:auto;border-bottom-right-radius:4px}
  .adel-typing span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:#9AA3C4;
    animation:dt 1s infinite}
  .adel-typing span:nth-child(2){animation-delay:.2s}.adel-typing span:nth-child(3){animation-delay:.4s}
  @keyframes dt{0%,80%,100%{opacity:.3}40%{opacity:1}}
  #adel-chips{display:flex;gap:8px;flex-wrap:wrap;padding:0 14px 10px;background:#F0F3FF}
  #adel-chips button{border:1.5px solid #7C5CFC;color:#7C5CFC;background:#fff;border-radius:20px;
    padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  #adel-form{display:flex;align-items:center;gap:6px;border-top:1px solid #E4E7F5;padding:8px;background:#fff}
  #adel-input{flex:1;border:1.5px solid #E4E7F5;border-radius:24px;padding:10px 14px;font-size:14px;
    outline:none;direction:rtl;font-family:inherit}
  #adel-input:focus{border-color:#7C5CFC}
  #adel-form button{border:none;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:17px;color:#fff}
  #adel-send{background:#7C5CFC}
  #adel-mic{background:#00C2A8}
  #adel-mic.on{background:#F04848;animation:adelPulse 1s infinite}
  @media(max-width:520px){
    #adel-box{right:8px;left:8px;width:auto;bottom:8px;max-height:calc(100vh - 16px);height:calc(100vh - 16px)}
    #adel-launch span.t{display:none}
    #adel-launch{padding:6px}
  }
</style>

<button id="adel-launch" class="pulse" aria-label="كلّم عادل">
  <div class="av"><div class="avh"></div><i class="dot"></i></div>
  <span class="t">كلّم عادل 👋</span>
</button>

<div id="adel-box">
  <div id="adel-head">
    <div class="big"><div class="avh"></div></div>
    <div>
      <h4>عادل محمد رفعت</h4>
      <div class="st"><i></i> متصل الآن · DentCraft</div>
      <div class="wave"><b></b><b></b><b></b><b></b></div>
    </div>
    <div class="hbtn">
      <button id="adel-voice" title="الصوت">🔇</button>
      <button id="adel-close" title="إغلاق">✕</button>
    </div>
  </div>
  <div id="adel-msgs"></div>
  <div id="adel-chips">
    <button>الأسعار 💰</button>
    <button>عايز أطلب منتجات 📦</button>
    <button>خدماتك الرقمية 💻</button>
  </div>
  <div id="adel-form">
    <button id="adel-mic" title="اتكلم">🎤</button>
    <input id="adel-input" placeholder="اكتب رسالتك..." autocomplete="off">
    <button id="adel-send">➤</button>
  </div>
</div>

<script>
(function () {
  var WORKER_URL = "https://adel-bot.tlgeee3.workers.dev";
  var PHOTO = "adel.jpg";

  var $ = function (id) { return document.getElementById(id); };
  var launch = $("adel-launch"), box = $("adel-box"), head = $("adel-head"),
      msgs = $("adel-msgs"), input = $("adel-input"), chips = $("adel-chips");
  var history = [], busy = false, voiceOn = false;

  /* ---------- شخصية كاريكاتير احتياطية لو الصورة مش موجودة ---------- */
  var CARTOON = '<svg class="adel-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' +
    '<rect width="100" height="100" fill="#E6E9FF"/>' +
    '<path d="M12 100c2-24 18-32 38-32s36 8 38 32z" fill="#1E2749"/>' +
    '<path d="M42 68l8 12 8-12z" fill="#fff"/>' +
    '<rect x="44" y="56" width="12" height="14" rx="5" fill="#E8B48C"/>' +
    '<ellipse cx="50" cy="40" rx="20" ry="23" fill="#F2C29B"/>' +
    '<path d="M29 38c0-18 12-24 21-24s21 6 21 24c-4-9-10-13-21-13s-17 4-21 13z" fill="#2B2118"/>' +
    '<circle cx="42" cy="40" r="2.6" fill="#2B2118"/><circle cx="58" cy="40" r="2.6" fill="#2B2118"/>' +
    '<path d="M37 35q5-3 9 0M54 35q5-3 9 0" stroke="#2B2118" stroke-width="2" fill="none" stroke-linecap="round"/>' +
    '<path d="M32 48c3 14 11 19 18 19s15-5 18-19c-4 6-10 8-18 8s-14-2-18-8z" fill="#3A2C20"/>' +
    '<ellipse class="mouth" cx="50" cy="55" rx="5" ry="2.6" fill="#7A1F2B"/></svg>';

  function mountAvatars() {
    var holders = document.querySelectorAll(".avh");
    holders.forEach(function (h) {
      var img = new Image();
      img.onload = function () { h.replaceWith(img); };
      img.onerror = function () { h.outerHTML = CARTOON; };
      img.alt = "عادل";
      img.src = PHOTO;
      img.style.cssText = "width:100%;height:100%;object-fit:cover;display:block";
    });
  }
  mountAvatars();

  /* ---------- الصوت ---------- */
  function pickVoice() {
    var vs = window.speechSynthesis ? speechSynthesis.getVoices() : [];
    return vs.find(function (v) { return /ar-EG/i.test(v.lang); }) ||
           vs.find(function (v) { return /^ar/i.test(v.lang); }) || null;
  }
  function speak(text) {
    if (!voiceOn || !window.speechSynthesis) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text.replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, ""));
    u.lang = "ar-EG"; u.rate = 1;
    var v = pickVoice(); if (v) u.voice = v;
    u.onstart = function () { head.classList.add("speaking"); };
    u.onend = u.onerror = function () { head.classList.remove("speaking"); };
    speechSynthesis.speak(u);
  }
  $("adel-voice").onclick = function () {
    voiceOn = !voiceOn;
    this.textContent = voiceOn ? "🔊" : "🔇";
    if (!voiceOn && window.speechSynthesis) { speechSynthesis.cancel(); head.classList.remove("speaking"); }
  };

  /* ---------- الرسائل ---------- */
  function add(role, text) {
    var d = document.createElement("div");
    d.className = "adel-m " + (role === "user" ? "adel-user" : "adel-bot");
    d.textContent = text;
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }
  function typing() {
    var d = document.createElement("div");
    d.className = "adel-m adel-bot adel-typing";
    d.innerHTML = "<span></span><span></span><span></span>";
    msgs.appendChild(d); msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  var GREETING = "أهلاً يا فندم 👋 أنا عادل. تحب أساعدك في إيه؟";
  add("bot", GREETING);

  async function submit(textOverride) {
    var text = (textOverride || input.value).trim();
    if (!text || busy) return;
    busy = true; input.value = "";
    chips.style.display = "none";
    add("user", text);
    history.push({ role: "user", text: text });
    var wait = typing(), reply;
    try {
      var res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      var data = await res.json();
      reply = data.reply;
    } catch (e) {
      reply = "حصلت مشكلة، ابعتلي على الواتساب 01282175854 وهرد عليك.";
    }
    wait.remove();
    add("bot", reply);
    history.push({ role: "bot", text: reply });
    speak(reply);
    busy = false;
  }

  /* ---------- فتح / قفل ---------- */
  function open() {
    box.style.display = "flex"; launch.classList.remove("pulse"); input.focus();
  }
  function close() {
    box.style.display = "none";
    if (window.speechSynthesis) speechSynthesis.cancel();
    head.classList.remove("speaking");
  }
  launch.onclick = function () { box.style.display === "flex" ? close() : open(); };
  $("adel-close").onclick = close;

  $("adel-send").onclick = function () { submit(); };
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") submit(); });
  chips.querySelectorAll("button").forEach(function (b) {
    b.onclick = function () { submit(b.textContent.replace(/[^\u0600-\u06FF\s]/g, "").trim()); };
  });

  /* ---------- الكلام بالصوت ---------- */
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, mic = $("adel-mic");
  if (!SR) { mic.style.display = "none"; }
  else {
    var rec = new SR(); rec.lang = "ar-EG"; rec.interimResults = false;
    rec.onresult = function (e) { voiceOn = true; $("adel-voice").textContent = "🔊"; submit(e.results[0][0].transcript); };
    rec.onend = function () { mic.classList.remove("on"); };
    mic.onclick = function () {
      if (mic.classList.contains("on")) { rec.stop(); return; }
      try { rec.start(); mic.classList.add("on"); } catch (e) {}
    };
  }
})();
</script>
